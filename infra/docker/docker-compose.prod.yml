# =============================================================================
# CPI GO, VPS unique et NU, sans Dokploy.
#
# Ce fichier ne décrit PAS la production actuelle, qui tourne sur un hôte
# Dokploy approvisionné par infra/dokploy/deploy.py. Il ne peut pas y tourner :
# le Caddy ci-dessous réclame les ports 80 et 443, que Traefik occupe déjà. Le
# service `backup` plus bas ne s'exécute donc PAS en production ; la sauvegarde
# de production est le routeur natif de Dokploy, voir infra/README.md § 4.
#
#   caddy     seul conteneur exposé sur Internet, termine TLS (Let's Encrypt)
#   web       Next.js 16, rendu du panel admin
#   api       NestJS 11 sur Fastify
#   migrate   éphémère : applique les migrations Prisma puis s'arrête
#   postgres  source de vérité, JAMAIS exposée à l'hôte
#   backup    pg_dump quotidien hors du volume de données, avec rétention
#
#   cd infra/docker
#   cp production.env.example .env      # puis remplir les secrets
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Voir infra/README.md pour la procédure complète.
# =============================================================================

# Nom de projet EXPLICITE, même raison que le compose de développement.
# Sans lui, Compose déduit le nom du dossier parent, ici « docker », et ce
# projet partagerait son espace de noms avec tout autre dépôt CPI dont le
# compose vit aussi dans infra/docker/. Un `up` ici remplacerait alors les
# conteneurs de l'autre projet, postgres compris, sans le moindre
# avertissement. Le suffixe -prod le distingue en plus du compose de dev sur
# une machine où les deux tourneraient.
name: cpi-go-prod

# Ancre partagée : plafonner les journaux. Un conteneur bavard remplit sinon
# le disque du VPS, et c'est postgres qui tombe en premier.
x-logging: &logging
  driver: json-file
  options:
    max-size: '20m'
    max-file: '5'

services:
  postgres:
    image: postgres:18.4
    container_name: cpi-go-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm}
      POSTGRES_USER: ${POSTGRES_USER:-crm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD doit être défini dans infra/docker/.env}
      # Nécessaire pour que pg_dump et l'API trient et comparent les chaînes de
      # la même façon qu'en développement.
      POSTGRES_INITDB_ARGS: '--locale=C.UTF-8 --encoding=UTF8'
    volumes:
      - pgdata:/var/lib/postgresql
    # Volontairement AUCUN `ports:`. La base n'est joignable que depuis le
    # réseau interne. Pour l'inspecter depuis un poste :
    #   ssh -L 5432:localhost:5432 vps -- docker exec -it cpi-go-postgres psql -U crm
    # ou, ponctuellement, décommenter en écoutant sur 127.0.0.1 uniquement.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-crm} -d ${POSTGRES_DB:-crm}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [cpi-go]
    logging: *logging

  # Cache des agrégats. Mémoire bornée et persistance coupée par l'API à la
  # connexion (redis.service.ts), même réglage ici et sur Dokploy. L'API démarre
  # et sert sans lui ; il n'est donc attendu qu'en `started`.
  redis:
    image: redis:8-alpine
    container_name: cpi-go-redis
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD doit être défini dans infra/docker/.env}
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [cpi-go]
    logging: *logging

  # Service éphémère : applique les migrations puis sort en 0. `api` et `web`
  # attendent sa terminaison réussie, ce qui garantit qu'aucune requête n'est
  # servie contre un schéma périmé. `restart: "no"` est explicite : une
  # migration qui échoue doit rester échouée et bloquer le déploiement, pas
  # boucler.
  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: migrator
    image: cpi-go-migrate:latest
    container_name: cpi-go-migrate
    restart: 'no'
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cpi-go]
    logging: *logging

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.api
      target: runner
    image: cpi-go-api:latest
    container_name: cpi-go-api
    restart: unless-stopped
    env_file: [.env]
    environment:
      NODE_ENV: production
      PORT: '3001'
      DATABASE_URL: postgresql://${POSTGRES_USER:-crm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-crm}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Swagger fermé en production : le contrat est publié par la CI, pas par
      # le serveur de production.
      API_DOCS_ENABLED: 'false'
      # Espace de démonstration fermé : sa fabrique engendre neuf cent mille
      # lignes fictives, à tenir hors de la base qui porte les vraies fiches.
      DEMO_WORKSPACE_ENABLED: 'false'
      # Les APK publiés depuis le panel doivent survivre à une nouvelle image.
      APK_RELEASE_DIR: /repo/storage/releases
      # Exports intégraux de la base. Même motif que ci-dessus : le fichier vit
      # hors de l'image, sinon un redéploiement laisserait un état qui annonce
      # un fichier disparu. Il est détruit dès son téléchargement.
      DB_DUMP_DIR: /repo/storage/db-dumps
      # Caddy est en amont et réécrit X-Forwarded-For, donc l'en-tête est
      # digne de confiance ici, et il le faut, sinon toutes les requêtes
      # paraissent venir de l'IP de Caddy et le throttler devient global.
      API_TRUST_PROXY_HEADERS: 'true'
      PUBLIC_WEB_URL: https://${DOMAIN:?DOMAIN doit être défini dans infra/docker/.env}
      API_CORS_ORIGINS: https://${DOMAIN}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      migrate:
        condition: service_completed_successfully
    # Sonde HTTP sur la route de disponibilité réelle. Le commentaire qui
    # occupait ces lignes disait que « la route de santé n'est pas figée » et
    # promettait de remplacer la sonde TCP « dès que la route existe » : elle
    # existe (apps/api/src/modules/health/health.controller.ts, /health/live et
    # /health/ready) et la CI l'interroge déjà dans quality-extended.yml.
    #
    # La différence n'est pas théorique. Une sonde TCP réussit dès que le
    # socket écoute, c'est-à-dire avant que Nest ait fini de monter ses modules
    # et sans rien savoir de la base. `api` était donc déclaré `healthy` trop
    # tôt, et `web`, qui l'attend par `depends_on: service_healthy`, démarrait
    # contre une API qui répondait encore 503. `/health/ready` ne répond 200
    # que quand l'application peut réellement servir.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:http').get('http://127.0.0.1:3001/health/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [cpi-go]
    volumes:
      - apk-releases:/repo/storage/releases
      - db-dumps:/repo/storage/db-dumps
    logging: *logging

  web:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        # Next.js fige les NEXT_PUBLIC_* dans le bundle au build : cette valeur
        # doit donc être connue ici, pas au démarrage du conteneur.
        NEXT_PUBLIC_API_URL: https://${DOMAIN}/api
    image: cpi-go-web:latest
    container_name: cpi-go-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: '3000'
      HOSTNAME: '0.0.0.0'
      # Chemin serveur→serveur, à l'intérieur du réseau Docker : les Route
      # Handlers de Next joignent l'API sans repasser par Internet ni par TLS.
      API_INTERNAL_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "require('node:net').connect(3000,'127.0.0.1').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks: [cpi-go]
    logging: *logging

  caddy:
    image: caddy:2.10-alpine
    container_name: cpi-go-caddy
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      # Let's Encrypt écrit ici en cas d'expiration imminente.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL doit être défini dans infra/docker/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats DOIVENT survivre à un `docker compose down`, sinon
      # chaque redéploiement en redemande et Let's Encrypt limite à 5 par
      # semaine et par domaine : au sixième, le site n'a plus de certificat.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [cpi-go]
    logging: *logging

  # Sauvegarde quotidienne. Écrit dans un bind mount de l'hôte, en dehors du
  # volume de données : un `docker volume rm pgdata` malheureux, ou une
  # corruption du volume, ne doit pas emporter les sauvegardes avec lui.
  backup:
    image: postgres:18.4
    container_name: cpi-go-backup
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-crm}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-crm}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_HOUR: ${BACKUP_HOUR:-2}
      TZ: ${TZ:-Africa/Dakar}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
    entrypoint: ['/bin/bash', '/usr/local/bin/backup.sh']
    depends_on:
      postgres:
        condition: service_healthy
    networks: [cpi-go]
    logging: *logging

volumes:
  pgdata:
  apk-releases:
  db-dumps:
  caddy-data:
  caddy-config:

networks:
  cpi-go:
    driver: bridge
