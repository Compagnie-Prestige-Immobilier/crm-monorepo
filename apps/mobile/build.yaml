targets:
  $default:
    builders:
      drift_dev:
        options:
          # Les horodatages voyagent en ISO-8601 avec les millisecondes. Stockés
          # en secondes UNIX (défaut de drift), deux écritures faites dans la
          # même seconde deviendraient indiscernables : or c'est exactement ce
          # que le curseur keyset (updated_at, id) doit départager.
          #
          # Conséquence assumée : drift sérialise un DateTime local avec son
          # décalage horaire, donc toute comparaison d'instants en SQL passe par
          # `unixepoch()` (voir schema.drift), jamais par `<` sur le texte.
          store_date_time_values_as_text: true
          named_parameters: true
