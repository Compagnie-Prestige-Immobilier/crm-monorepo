name: cpi_go
description: "CPI GO : prospection terrain hors ligne (Android)."
publish_to: 'none'

version: 1.1.0+12

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  # Libellés Material en français (dates, sélecteurs, boutons système).
  flutter_localizations:
    sdk: flutter

  # ── État ────────────────────────────────────────────────────────────────────
  flutter_riverpod: ^3.0.0

  # ── Navigation ──────────────────────────────────────────────────────────────
  go_router: ^17.0.0

  # ── Base locale ─────────────────────────────────────────────────────────────
  # sqlite3_flutter_libs n'est PAS ajouté : depuis 0.6.0+eol c'est un shim vide.
  # drift_flutter tire `sqlite3`, qui embarque désormais ses propres natifs.
  # Épinglé au même palier que drift_dev : drift 2.34 introduit l'API
  # `drift3_preview` que l'outillage de schéma de drift_dev 2.34.0 ne sait pas
  # encore compiler. Dépareillés, `drift_dev schema dump` ne s'exécute plus et
  # le golden de migration devient impossible à produire.
  drift: '>=2.33.0 <2.34.0'
  drift_flutter: ^0.3.1
  # Tiré par drift_flutter, mais importé directement par database.dart pour le
  # type `CommonDatabase` du callback de PRAGMAs : une dépendance utilisée
  # explicitement se déclare explicitement.
  sqlite3: ^3.5.0

  # ── Stockage sécurisé (jetons) ──────────────────────────────────────────────
  # 10.3.1 et non 11.x : la 11 impose `compileSdk = 37` à tout le projet, alors
  # que la cible convenue est 36. Le chiffrement est identique dans les deux
  # (AES-256-GCM, clé enveloppée RSA-OAEP dans l'Android KeyStore).
  flutter_secure_storage: '>=10.3.1 <11.0.0'

  # ── Réseau ──────────────────────────────────────────────────────────────────
  # Client généré depuis apps/api/openapi.json. Dépendance de CHEMIN et non de
  # version : le contrat et l'app avancent dans le même commit, et un client
  # publié séparément se désynchroniserait du serveur sans que rien ne le dise.
  crm_api_client:
    path: ../../packages/api-client-dart
  # Tiré par crm_api_client, mais déclaré explicitement : `lib/core/network/`
  # construit lui-même l'unique instance Dio et écrit ses intercepteurs.
  dio: ^5.7.0

  # État d'interface réseau. Déclencheur UNIQUEMENT, jamais un verrou : sur les
  # réseaux mobiles sénégalais un lien dégradé rapporte `mobile` alors que rien
  # ne route. `connectivity_plus` mesure l'interface, pas l'accessibilité.
  connectivity_plus: ^7.0.0

  # ── Arrière-plan ────────────────────────────────────────────────────────────
  # Complément, pas chemin principal : les ROM Transsion et Xiaomi : majoritaires
  # au Sénégal : tuent les tâches de fond quoi qu'en dise AOSP.
  workmanager: ^0.10.0

  # ── Divers ──────────────────────────────────────────────────────────────────
  phosphor_flutter: ^2.1.0
  # Numéro de build : la restauration de route n'est valable que pour la version
  # qui l'a écrite. Restaurer `/x/y?draft=z` après une mise à jour qui a déplacé
  # cette route ouvrirait un écran d'erreur au démarrage.
  package_info_plus: ^10.0.0
  # Ouvre les réglages d'optimisation de batterie du constructeur. Il n'existe
  # pas d'API Flutter pour ça ; un Intent Android explicite est la seule voie.
  android_intent_plus: ^6.0.0
  uuid: ^4.6.0
  intl: ^0.20.2
  # Numéros étrangers de la diaspora. Parseur PUR DART (dépend du seul `meta`) :
  # aucun natif à construire, et rien de Material à mélanger au thème ForUI.
  # `phone_form_field` livre un widget complet mais Material, incompatible avec
  # le kit maison ; ce paquet ne fournit que le plan de numérotation, ce qui
  # manquait à `core/utils/phone.dart`.
  phone_numbers_parser: ^9.0.26
  path: ^1.9.0
  path_provider: ^2.1.5
  shared_preferences: ^2.5.0
  record: '>=6.1.2 <7.0.0'
  just_audio: ^0.10.6
  # Tirée par just_audio, mais importée directement par core/feedback : le mode
  # sonnerie et les attributs audio des sons d'interface s'y lisent. Jamais
  # `AudioSession.configure()` : la note vocale partage la session du processus.
  audio_session: ^0.2.4
  # Ni `firebase_core` ni `firebase_messaging` : le projet Firebase exige un
  # compte Google que CPI n'a pas et ne veut pas ouvrir. Le canal d'annonces est
  # donc l'inbox applicative, tirée depuis `/notifications/mine` (voir
  # `features/notifications/notification_inbox.dart`). Elle marche hors ligne,
  # ne demande aucune autorisation système, et ne dépend d'aucun tiers.
  crypto: ^3.0.3
  # Alarme des rappels représentants promis pendant un appel (issue CALLBACK).
  # Locale, pas Firebase : même raison que ci-dessus, et c'est justement ce
  # qu'il faut pour survivre à une app fermée sans dépendre d'un serveur push.
  flutter_local_notifications: ^19.4.2
  # Tirée par flutter_local_notifications (zonedSchedule exige un TZDateTime),
  # mais importée directement pour construire ces dates : voir le commentaire
  # sur `_businessTime` dans callback_picker.dart, Dakar est fixe en UTC toute
  # l'année, `tz.UTC` suffit — aucune base IANA n'est chargée.
  timezone: ^0.10.1

  # ── Système visuel ──────────────────────────────────────────────────────────
  # Migration progressive vers le langage visuel de references/gnawalma. Les
  # écrans encore Material cohabitent avec ForUI le temps de la migration
  # (voir core/theme/forui_theme.dart, lib/ui/widgets/cpi_kit.dart).
  forui: ^0.21.3

dev_dependencies:
  build_runner: ^2.4.13
  drift_dev: '>=2.33.0 <2.34.0'
  # riverpod_lint / custom_lint sont volontairement absents : custom_lint 0.8.x
  # est cloué sur analyzer ^8, drift_dev 2.34 exige analyzer ^13. Les deux ne
  # peuvent pas cohabiter aujourd'hui ; la base locale prime sur le linter.
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.6

flutter:
  uses-material-design: true

  assets:
    - assets/brand/
    - assets/sounds/
    - shorebird.yaml

  # Polices EMPAQUETÉES dans l'APK. Pas de `google_fonts` : un premier lancement
  # sur réseau faible afficherait une police de repli pendant dix secondes.
  fonts:
    - family: Plus Jakarta Sans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Light.ttf
          weight: 300
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700

# ── Icône de lanceur ──────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/brand/icon-512.png"
  min_sdk_android: 24
  adaptive_icon_background: "#630210"
  adaptive_icon_foreground: "assets/brand/icon-512.png"
  adaptive_icon_foreground_inset: 22

# ── Écran de démarrage ────────────────────────────────────────────────────────
# La surface neutre de l'application, pas l'aplat de marque : le démarrage
# natif et `_BrandSplash` doivent être le même écran. Le logo couleur est sur
# fond blanc opaque, d'où le fichier détouré blanc en sombre.
flutter_native_splash:
  color: "#FAF7F7"
  image: assets/brand/cpi-logo.png
  color_dark: "#141013"
  image_dark: assets/brand/cpi-header.png
  android_12:
    color: "#FAF7F7"
    image: assets/brand/cpi-logo.png
    icon_background_color: "#FAF7F7"
    color_dark: "#141013"
    image_dark: assets/brand/cpi-header.png
    icon_background_color_dark: "#141013"
  android: true
  ios: false
  web: false
  fullscreen: false
