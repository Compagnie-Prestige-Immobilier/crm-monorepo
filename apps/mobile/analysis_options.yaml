include: package:flutter_lints/flutter.yaml

# Le reste du dépôt compile en TypeScript strict. Dart restait sur le gabarit
# d'usine : ni casts implicites signalés, ni futures oubliées, ni abonnements
# non fermés. Ce sont exactement les défauts qui ne se voient qu'en production,
# sur un téléphone hors ligne.
analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Une erreur, pas un avertissement : une fuite d'abonnement sur un écran de
    # saisie se paie en batterie et en écritures fantômes après démontage.
    cancel_subscriptions: error
    close_sinks: error
    use_build_context_synchronously: error
    unawaited_futures: error
  exclude:
    - lib/**/*.g.dart
    - lib/**/*.freezed.dart
    - test/data/generated_migrations/**
    - build/**
    - android/**

linter:
  rules:
    # ── Asynchrone : la source des plantages qu'aucun test ne reproduit ───────
    - avoid_slow_async_io
    - discarded_futures
    - unawaited_futures
    - await_only_futures
    - use_build_context_synchronously

    # ── Cycle de vie : ce qui fuit sur un écran qu'on ouvre cent fois par jour ─
    - cancel_subscriptions
    - close_sinks
    - always_declare_return_types

    # ── Correction ────────────────────────────────────────────────────────────
    - avoid_dynamic_calls
    - avoid_type_to_string
    - collection_methods_unrelated_type
    - literal_only_boolean_expressions
    - no_adjacent_strings_in_list
    - throw_in_finally
    - unnecessary_statements
    - test_types_in_equals

    # ── Lisibilité, sans zèle ─────────────────────────────────────────────────
    - prefer_final_locals
    - prefer_const_constructors
    - prefer_const_declarations
    - unnecessary_parenthesis
    - use_named_constants
