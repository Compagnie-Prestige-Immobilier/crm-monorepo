version: '2'

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - asasalint
    - bidichk
    - bodyclose
    - contextcheck
    - copyloopvar
    - depguard
    - dupl
    - durationcheck
    - errcheck
    - errchkjson
    - errname
    - errorlint
    - exhaustive
    - gocheckcompilerdirectives
    - gochecknoinits
    - gocognit
    - goconst
    - gocritic
    - gocyclo
    - godox
    - gosec
    - govet
    - ineffassign
    - interfacebloat
    - intrange
    - makezero
    - mirror
    - nakedret
    - nestif
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - perfsprint
    - prealloc
    - predeclared
    - reassign
    - revive
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
    - wastedassign
  settings:
    depguard:
      rules:
        cap-v2:
          deny:
            - pkg: github.com/gin-gonic/gin
              desc: net/http + huma, decision plan.md 2.1
            - pkg: github.com/labstack/echo
              desc: net/http + huma, decision plan.md 2.1
            - pkg: github.com/gofiber/fiber
              desc: net/http + huma, decision plan.md 2.1
            - pkg: gorm.io
              desc: pgx + sqlc, decision plan.md 2.1
            - pkg: github.com/redis
              desc: cache memoire, decision plan.md 2.1
    dupl:
      threshold: 80
    goconst:
      min-len: 3
      min-occurrences: 3
    gocognit:
      min-complexity: 15
    gocyclo:
      min-complexity: 12
    nestif:
      min-complexity: 4
    interfacebloat:
      max: 5
    nolintlint:
      require-explanation: true
      require-specific: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
    revive:
      rules:
        - name: unused-parameter
        - name: unused-receiver
        - name: early-return
        - name: indent-error-flow
        - name: superfluous-else
        - name: bool-literal-in-expr
        - name: confusing-results
        - name: defer
        - name: deep-exit
        - name: unnecessary-stmt
        - name: use-any
        - name: redundant-import-alias
  exclusions:
    generated: strict
    paths:
      - db
    rules:
      - path: _test\.go$
        linters:
          - dupl
          - gosec
          - goconst

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - db
