sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.organization=${env.SONAR_ORGANIZATION}
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

sonar.exclusions=db/**,web/dist/**,web/src/api/schema.d.ts,web/src/routeTree.gen.ts,**/node_modules/**
sonar.tests=.,e2e
sonar.test.inclusions=**/*_integration_test.go,**/*.spec.ts
# Pas de tests unitaires ni de couverture : le portillon ne doit pas en exiger.
sonar.coverage.exclusions=**/*
