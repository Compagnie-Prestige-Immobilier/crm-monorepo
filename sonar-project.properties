sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.organization=${env.SONAR_ORGANIZATION}
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Generated clients, build output and third-party/mobile artifacts are not
# authored application code and would distort the review signal.
sonar.exclusions=**/dist/**,**/.next/**,**/node_modules/**,**/generated/**,**/*.g.dart,**/build/**,**/coverage/**
sonar.tests=apps/api/src,apps/web/src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.integration.test.ts
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.coverage.exclusions=**/*.test.ts,**/*.test.tsx,**/*.integration.test.ts,**/generated/**,**/dist/**
