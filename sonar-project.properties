sonar.projectKey=${env.SONAR_PROJECT_KEY}
sonar.organization=${env.SONAR_ORGANIZATION}
sonar.host.url=https://sonarcloud.io
sonar.sourceEncoding=UTF-8

# Generated clients, build output and third-party/mobile artifacts are not
# authored application code and would distort the review signal.
#
# `packages/api-client-dart/lib` est nomme EN ENTIER, et pas seulement par
# `**/*.g.dart`. Le generateur OpenAPI y ecrit 193 fichiers Dart qui ne portent
# pas ce suffixe, un par modele et un par API : ni `**/generated/**` ni
# `**/*.g.dart` ne les attrapait. Des milliers de lignes engendrees comptaient
# donc comme du code neuf non couvert, ce qui fait tomber le portillon sur une
# mesure qui n'apprend rien a personne. Le repertoire entier est engendre, il
# n'y a pas une ligne ecrite a la main a y trouver.
sonar.exclusions=**/dist/**,**/.next/**,**/node_modules/**,**/generated/**,**/*.g.dart,**/build/**,packages/api-client-dart/lib/**
sonar.tests=apps/api/src,apps/web/e2e
sonar.test.inclusions=**/*.integration.test.ts,**/*.spec.ts
# Plus de tests unitaires ni de couverture : le portillon Sonar ne doit pas
# exiger de couverture sur le code neuf.
sonar.coverage.exclusions=**/*
