version: '2'
sql:
  - engine: postgresql
    schema: sql/schema.sql
    queries: sql/queries
    database:
      uri: ${TEST_DATABASE_URL}
    analyzer:
      database: false
    rules:
      - sqlc/db-prepare
    gen:
      go:
        package: db
        out: db
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        overrides:
          - db_type: pg_catalog.timestamp
            go_type: time.Time
          - db_type: pg_catalog.timestamp
            nullable: true
            go_type:
              type: time.Time
              pointer: true
