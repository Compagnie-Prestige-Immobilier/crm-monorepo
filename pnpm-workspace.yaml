packages:
  - apps/api
  - apps/web
  - packages/*

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/engines'
  - '@swc/core'
  - 'argon2'
  - 'esbuild'
  - 'prisma'
  - 'sharp'
  - 'unrs-resolver'

# Les scripts d'installation de ces paquets sont des bannières de financement
# (`opencollective || exit 0`) : aucun artefact n'en dépend. openapi-generator-cli
# ne télécharge PAS son jar au postinstall — il le fait à la première exécution,
# dans le storageDir défini par /openapitools.json.
ignoredBuiltDependencies:
  - '@nestjs/core'
  - '@openapitools/openapi-generator-cli'
  - '@scarf/scarf'

allowBuilds:
  '@nestjs/core': false
  '@openapitools/openapi-generator-cli': false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Single source of truth for every dependency version in the monorepo.
# Packages declare `"catalog:"` and never a literal range.
catalog:
  # --- toolchain ---
  '@types/node': '26.1.1'
  'eslint': '10.7.0'
  'eslint-config-prettier': '10.1.8'
  'eslint-plugin-import-x': '4.17.1'
  'globals': '16.5.0'
  'prettier': '3.9.5'
  'tsx': '4.23.1'
  'turbo': '2.10.5'
  'typescript': '5.9.3'
  'typescript-eslint': '8.64.0'
  'vitest': '4.1.10'
  '@vitest/coverage-v8': '4.1.10'

  # --- api (NestJS on Fastify, ESM) ---
  '@nestjs/common': '11.1.28'
  '@nestjs/config': '4.0.4'
  '@nestjs/core': '11.1.28'
  '@nestjs/jwt': '^11.0.0'
  '@nestjs/platform-fastify': '11.1.28'
  '@nestjs/swagger': '11.4.6'
  '@nestjs/testing': '11.1.28'
  '@nestjs/throttler': '^6.4.0'
  '@fastify/cors': '11.3.0'
  '@fastify/helmet': '13.1.0'
  '@fastify/rate-limit': '11.1.0'
  # Requis par SwaggerModule.setup() sur FastifyAdapter : c'est lui qui sert les
  # ressources statiques de Swagger UI. Sans lui, /api/docs échoue au démarrage.
  '@fastify/static': '10.1.2'
  'fastify': '5.10.0'
  'argon2': '0.45.0'
  'class-transformer': '0.5.1'
  'class-validator': '0.14.3'
  'reflect-metadata': '0.2.2'
  'rxjs': '7.8.2'
  'zod': '4.4.3'
  'exceljs': '^4.4.0'
  'libphonenumber-js': '^1.12.0'
  'nestjs-pino': '^4.4.0'
  # Génération PDF côté serveur (programmes d'appel de la phase 2). Choisi
  # contre un moteur de rendu HTML : pdfkit écrit dans un flux Node et ne
  # demande ni Chromium, ni sandbox, ni ~300 Mo d'image supplémentaires.
  'pdfkit': '0.19.1'
  '@types/pdfkit': '0.17.6'
  'pino': '^9.6.0'
  'pino-http': '^10.4.0'
  'pino-pretty': '^13.0.0'
  'uuid': '^13.0.0'

  # --- database ---
  '@prisma/adapter-pg': '7.9.0'
  '@prisma/client': '7.9.0'
  'prisma': '7.9.0'
  'pg': '8.22.0'
  '@types/pg': '8.20.0'

  # --- contract / generated clients ---
  '@openapitools/openapi-generator-cli': '2.24.0'
  'openapi-fetch': '0.17.0'
  'openapi-typescript': '7.13.0'

  # --- web (Next.js 16 admin) ---
  'next': '16.2.12'
  'react': '19.2.7'
  'react-dom': '19.2.7'
  '@types/react': '^19.2.0'
  '@types/react-dom': '^19.2.0'
  'tailwindcss': '^4.1.0'
  '@tailwindcss/postcss': '^4.1.0'
  'tw-animate-css': '^1.4.0'
  'class-variance-authority': '^0.7.1'
  'clsx': '^2.1.1'
  'tailwind-merge': '^3.3.0'
  'lucide-react': '^0.550.0'
  'next-themes': '^0.4.6'
  'sonner': '^2.0.0'
  '@tanstack/react-query': '^5.90.0'
  '@tanstack/react-table': '^8.21.0'
  'chart.js': '^4.5.0'
  'react-chartjs-2': '^5.3.0'
  'react-hook-form': '^7.64.0'
  '@hookform/resolvers': '^5.2.0'
  'date-fns': '^4.1.0'
  '@playwright/test': '1.61.1'
  # Radix primitives backing the shadcn/ui components in apps/web.
  '@radix-ui/react-avatar': '1.2.6'
  '@radix-ui/react-dialog': '1.1.23'
  '@radix-ui/react-dropdown-menu': '2.1.24'
  '@radix-ui/react-label': '2.1.15'
  '@radix-ui/react-popover': '1.1.23'
  '@radix-ui/react-select': '2.3.7'
  '@radix-ui/react-separator': '1.1.15'
  '@radix-ui/react-slot': '1.3.3'
  '@radix-ui/react-tabs': '1.1.21'
  'cmdk': '1.1.1'
