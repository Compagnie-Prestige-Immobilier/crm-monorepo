packages:
  - apps/api
  - apps/web
  - packages/*

# Keep transitive packages on patched releases when an upstream tool lags
# behind the security advisory. These are semver-compatible runtime patches;
# the lockfile remains the source of truth after regeneration.
overrides:
  axios: 1.18.0
  '@napi-rs/wasm-runtime': 1.2.2
  '@nestjs/core': 11.1.28
  find-my-way: 9.7.0
  file-type: 21.3.2
  get-tsconfig: 4.14.1
  glob: 11.1.0
  '@nestjs/swagger>js-yaml': 5.2.2
  postcss: 8.5.23
  sharp: 0.35.0
  shell-quote: 1.9.0
  rolldown: 1.2.3
  node-addon-api: 8.9.1
  path-to-regexp: 8.4.0
  uuid: 11.1.1
  valibot: 1.4.2

onlyBuiltDependencies:
  - '@parcel/watcher'
  - '@prisma/engines'
  - '@swc/core'
  - 'argon2'
  - 'esbuild'
  - 'prisma'
  - 'sharp'
  - 'unrs-resolver'

# Les scripts d'installation de ces paquets sont des bannières de financement
# (`opencollective || exit 0`) : aucun artefact n'en dépend. openapi-generator-cli
# ne télécharge PAS son jar au postinstall — il le fait à la première exécution,
# dans le storageDir défini par /openapitools.json.
ignoredBuiltDependencies:
  - '@nestjs/core'
  - '@openapitools/openapi-generator-cli'
  - '@scarf/scarf'

allowBuilds:
  '@nestjs/core': false
  '@openapitools/openapi-generator-cli': false
  '@parcel/watcher': true
  '@prisma/engines': true
  '@scarf/scarf': false
  '@swc/core': true
  argon2: true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

# Single source of truth for every dependency version in the monorepo.
# Packages declare `"catalog:"` and never a literal range.
catalog:
  # --- toolchain ---
  '@types/node': '26.1.1'
  'eslint-plugin-sonarjs': '4.2.0'
  'knip': '6.32.2'
  'oxlint': '1.80.0'
  'oxlint-tsgolint': '7.0.2001'
  'prettier': '3.9.5'
  'tsx': '4.23.1'
  'turbo': '2.10.5'
  'typescript': '5.9.3'
  'vitest': '4.1.10'
  '@vitest/coverage-v8': '4.1.10'

  # --- api (NestJS on Fastify, ESM) ---
  '@nestjs/common': '11.1.28'
  '@nestjs/config': '4.0.4'
  '@nestjs/core': '11.1.28'
  '@nestjs/jwt': '^11.0.0'
  '@nestjs/platform-fastify': '11.1.28'
  # Ordonnanceur des rappels de notification. Seule dépendance transitive :
  # `cron`, qui n'exécute aucun script d'installation.
  '@nestjs/schedule': '6.1.3'
  '@nestjs/swagger': '11.4.6'
  '@nestjs/testing': '11.1.28'
  '@nestjs/throttler': '^6.4.0'
  '@fastify/cors': '11.3.0'
  '@fastify/helmet': '13.1.0'
  '@fastify/rate-limit': '11.1.0'
  # Requis par SwaggerModule.setup() sur FastifyAdapter : c'est lui qui sert les
  # ressources statiques de Swagger UI. Sans lui, /api/docs échoue au démarrage.
  '@fastify/static': '10.1.2'
  'fastify': '5.10.0'
  # Cache des agrégats. 5.x et non 6.x : la 6 active RESP3 par défaut, que ni
  # @fastify/rate-limit ni @nest-lab/throttler-storage-redis n'ont validé.
  'ioredis': '5.11.1'
  'argon2': '0.45.0'
  'class-transformer': '0.5.1'
  'class-validator': '0.14.3'
  'reflect-metadata': '0.2.2'
  'rxjs': '7.8.2'
  'zod': '4.4.3'
  'exceljs': '^4.4.0'
  'libphonenumber-js': '^1.12.0'
  'nestjs-pino': '^4.4.0'
  # Génération PDF côté serveur (programmes d'appel de la phase 2). Choisi
  # contre un moteur de rendu HTML : pdfkit écrit dans un flux Node et ne
  # demande ni Chromium, ni sandbox, ni ~300 Mo d'image supplémentaires.
  'pdfkit': '0.19.1'
  '@types/pdfkit': '0.17.6'
  'jszip': '3.10.1'
  'pino': '9.11.0'
  'pino-http': '^10.4.0'
  'pino-pretty': '^13.0.0'
  'uuid': '^13.0.0'
  # Lecture du `AndroidManifest.xml` d'un APK. Ce manifeste est du XML BINAIRE
  # Android (AXML) : une table de chaînes suivie d'un flux d'enregistrements,
  # que ni une expression régulière ni un analyseur XML ordinaire ne savent
  # lire. Fork DeviceFarmer (les mainteneurs d'OpenSTF), republié en 2026, 40 Ko
  # de source, Apache-2.0, et exercé chaque jour sur des milliers d'APK réels
  # dans des fermes d'appareils. Voir `apk-manifest.ts` pour les alternatives
  # écartées.
  '@devicefarmer/adbkit-apkreader': '3.2.4'

  # --- database ---
  '@prisma/adapter-pg': '7.9.0'
  '@prisma/client': '7.9.0'
  'prisma': '7.9.0'
  'pg': '8.22.0'
  '@types/pg': '8.20.0'

  # --- contract / generated clients ---
  '@openapitools/openapi-generator-cli': '2.24.0'
  'openapi-fetch': '0.17.0'
  'openapi-typescript': '7.13.0'

  # --- web (Next.js 16 admin) ---
  'next': '16.2.12'
  'react': '19.2.7'
  'react-dom': '19.2.7'
  '@types/react': '^19.2.0'
  '@types/react-dom': '^19.2.0'
  'tailwindcss': '^4.1.0'
  '@tailwindcss/postcss': '^4.1.0'
  'tw-animate-css': '^1.4.0'
  'class-variance-authority': '^0.7.1'
  'clsx': '^2.1.1'
  'tailwind-merge': '^3.3.0'
  'lucide-react': '^0.550.0'
  'next-themes': '^0.4.6'
  'sonner': '^2.0.0'
  '@tanstack/react-query': '^5.90.0'
  '@tanstack/react-table': '^8.21.0'
  'chart.js': '^4.5.0'
  'react-chartjs-2': '^5.3.0'
  # Composition du tableau de bord. Le clavier reste servi par des boutons.
  '@dnd-kit/core': '^6.3.1'
  '@dnd-kit/sortable': '^10.0.0'
  '@dnd-kit/utilities': '^3.2.2'
  'react-hook-form': '^7.64.0'
  '@hookform/resolvers': '^5.2.0'
  'date-fns': '^4.1.0'
  '@playwright/test': '1.61.1'
  # Base UI primitives backing the shadcn/ui components in apps/web.
  '@base-ui/react': '1.7.0'
  'cmdk': '1.1.1'
  # Fait échouer le build si un module serveur est importé depuis un composant client.
  'server-only': '0.0.1'
  # Rendu de composants React sous Vitest. `environment: 'node'` ne fournit aucun
  # DOM : sans jsdom, aucun écran du panel ne peut être monté dans un test.
  # `@testing-library/dom` est une dépendance de pair de `react`, donc déclarée.
  'jsdom': '30.0.1'
  '@testing-library/react': '16.3.2'
  '@testing-library/dom': '10.4.1'
  '@testing-library/user-event': '14.6.4'

# ── Politique d'approvisionnement ────────────────────────────────────────────
#
# `minimumReleaseAge` refuse toute version publiée il y a moins de 24 heures
# (1440 minutes).
#
# C'est la seule défense qui fonctionne contre le mode d'attaque npm réellement
# observé : compromission du compte d'un mainteneur, publication d'un patch
# malveillant, exfiltration chez tous ceux qui installent dans les heures qui
# suivent. Ces paquets sont dépubliés en général sous 24 à 72 h — mais après
# avoir touché ceux qui ont installé les premiers. Sept jours est le seuil
# recommandé parce qu'il couvre le délai de détection observé, pas seulement le
# délai médian.
#
# Contrepartie assumée : un correctif de sécurité publié cette semaine ne
# s'installe pas. Le contourner est explicite
# (`pnpm install --config.minimumReleaseAge=0`), donc c'est une décision qu'on
# prend sciemment, pas un défaut qu'on subit sans le savoir.
minimumReleaseAge: 1440

# Une dépendance TRANSITIVE ne peut pas être tirée depuis une URL arbitraire, un
# dépôt git ou une archive locale. Sans ce garde-fou, n'importe quel maillon de
# l'arbre fait installer du code qui ne vient pas du registre — donc que ni
# l'audit, ni `osv-scanner`, ni le fichier de verrouillage ne décrivent
# réellement.
blockExoticSubdeps: true

# `no-downgrade` : une mise à jour de paquet ne peut pas AFFAIBLIR les réglages
# de sécurité en vigueur. C'est la parade au scénario où le paquet compromis
# commence par désactiver les protections qui l'auraient arrêté.
trustPolicy: no-downgrade

# Aucun script d'installation exécuté par défaut. Les exceptions sont nommées
# une par une dans `onlyBuiltDependencies` ci-dessus — c'est là que
# `postinstall` devient un choix explicite et non un droit acquis.
dangerouslyAllowAllBuilds: false
