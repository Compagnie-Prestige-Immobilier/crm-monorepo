packages:
  - web
  - e2e

# Correctifs transitifs maintenus en avance sur les outils qui les tirent.
overrides:
  axios: 1.18.0
  '@napi-rs/wasm-runtime': 1.2.2
  file-type: 21.3.2
  get-tsconfig: 4.14.1
  glob: 11.1.0
  # @babel/core (plugin Vite de TanStack Router) tire semver@6 sans attestation
  # de provenance : pnpm refuse l'install (trustPolicy no-downgrade).
  semver: 7.8.5
  postcss: 8.5.23
  shell-quote: 1.9.0
  rolldown: 1.2.3
  node-addon-api: 8.9.1
  path-to-regexp: 8.4.0
  uuid: 11.1.1
  valibot: 1.4.2
  deepmerge-ts: 8.0.0
  js-yaml: 4.3.2

onlyBuiltDependencies:
  - '@parcel/watcher'
  - 'esbuild'
  - 'unrs-resolver'

ignoredBuiltDependencies:
  - '@scarf/scarf'

allowBuilds:
  '@parcel/watcher': true
  '@scarf/scarf': false
  esbuild: true
  lefthook: false
  unrs-resolver: true

catalog:
  '@types/node': '26.1.1'
  'eslint-plugin-sonarjs': '4.2.0'
  'knip': '6.32.2'
  'lefthook': '2.1.14'
  'oxlint': '1.80.0'
  'oxlint-tsgolint': '7.0.2001'
  'prettier': '3.9.5'
  'typescript': '5.9.3'
  'zod': '4.4.3'
  'exceljs': '^4.4.0'
  'pg': '8.22.0'
  '@types/pg': '8.20.0'
  'openapi-fetch': '0.17.0'
  'openapi-typescript': '7.13.0'
  'react': '19.2.7'
  'react-dom': '19.2.7'
  '@types/react': '^19.2.0'
  '@types/react-dom': '^19.2.0'
  'tailwindcss': '^4.1.0'
  'tw-animate-css': '^1.4.0'
  '@fontsource-variable/bricolage-grotesque': '^5.3.0'
  '@fontsource-variable/plus-jakarta-sans': '^5.3.0'
  'class-variance-authority': '^0.7.1'
  'clsx': '^2.1.1'
  'tailwind-merge': '^3.3.0'
  'lucide-react': '^0.550.0'
  'sonner': '^2.0.0'
  '@tanstack/react-query': '^5.90.0'
  '@dnd-kit/core': '^6.3.1'
  '@dnd-kit/sortable': '^10.0.0'
  '@dnd-kit/utilities': '^3.2.2'
  'tunnel-rat': '^0.1.2'
  'react-hook-form': '^7.64.0'
  '@hookform/resolvers': '^5.2.0'
  'date-fns': '^4.4.0'
  '@playwright/test': '1.61.1'
  '@base-ui/react': '1.7.0'
  'cmdk': '1.1.1'
  'motion': '13.4.4'
  '@assistant-ui/react': '0.15.22'
  'vite': '^8.2.2'
  '@vitejs/plugin-react': '^6.1.1'
  '@tailwindcss/vite': '^4.3.3'
  '@tanstack/react-router': '^1.170.33'
  '@tanstack/router-plugin': '^1.168.36'

# Refuse toute version publiée depuis moins de 24 h : la fenêtre où un paquet
# compromis circule avant d'être dépublié. Contournement explicite :
# `pnpm install --config.minimumReleaseAge=0`.
minimumReleaseAge: 1440
blockExoticSubdeps: true
trustPolicy: no-downgrade
dangerouslyAllowAllBuilds: false
