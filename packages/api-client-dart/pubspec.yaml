# Client Dart généré depuis apps/api/openapi.json. Rien ici n'est écrit à la main.
#
# Ce fichier est protégé par .openapi-generator-ignore : openapi-generator écrit
# son propre pubspec.yaml à chaque exécution et écraserait sans prévenir les
# versions épinglées ci-dessous.
#
# Consommé par apps/mobile via une dépendance de chemin :
#
#   dependencies:
#     crm_api_client:
#       path: ../../packages/api-client-dart

name: crm_api_client
description: Client HTTP généré pour l'API CPI GO — dart-dio + json_serializable.
version: 0.0.0
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  # Le transport choisi par le générateur dart-dio.
  dio: ^5.7.0
  # `serializationLibrary: json_serializable` produit des classes annotées
  # @JsonSerializable : ce sont des classes Dart ordinaires, sans registre
  # global, directement stockables dans Drift et sérialisables dans l'outbox.
  json_annotation: ^4.9.0
  # `equalityCheckMethod: equatable` — indispensable pour que Riverpod et les
  # comparaisons de widgets voient deux modèles identiques comme égaux.
  # (Le code généré importe package:equatable/src/equatable_utils.dart, un
  # import d'implémentation : d'où `implementation_imports` non activé dans
  # analysis_options.yaml.)
  equatable: ^2.0.7
  # `skipCopyWith: false` fait émettre l'annotation `@CopyWith()` sur chaque
  # modèle. Elle vient de copy_with_extension — absente du pubspec écrit par le
  # générateur, ce qui fait échouer build_runner avec « Could not resolve
  # annotation for `class X` ». Vérifié sur le générateur 7.24.0.
  copy_with_extension: ^6.0.0
  collection: ^1.19.0
  meta: ^1.16.0

dev_dependencies:
  build_runner: ^2.4.13
  json_serializable: ^6.9.0
  copy_with_extension_gen: ^6.0.0
  lints: ^6.0.0
