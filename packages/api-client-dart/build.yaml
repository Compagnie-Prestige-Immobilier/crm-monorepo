# Configuration build_runner du client généré.
#
# Repris du build.yaml qu'écrit openapi-generator 7.24.0, avec UNE différence,
# et protégé par .openapi-generator-ignore pour que le générateur ne la remette
# pas à chaque exécution.
#
# ---------------------------------------------------------------------------
# disallow_unrecognized_keys: false  (le générateur met `true`)
# ---------------------------------------------------------------------------
# À `true`, tout modèle qui reçoit une clé JSON absente du contrat compilé lève
# une CheckedFromJsonException. Autrement dit : le jour où l'API ajoute un
# champ à une réponse — un ajout rétrocompatible par définition — toutes les
# versions déjà installées sur les téléphones du terrain cessent de parser
# cette réponse. Il n'existe aucun moyen de forcer la mise à jour de ces
# appareils, et la panne se manifesterait comme une synchronisation qui échoue
# sans raison visible, en brousse, chez un commercial.
#
# C'est le pendant exact de `enumUnknownDefaultCase: true` dans
# openapi-config.yaml : l'un protège des nouvelles valeurs d'énumération,
# l'autre des nouveaux champs. Les activer séparément n'a pas de sens.
#
# Le portillon oasdiff reste la protection dans l'autre sens : un champ
# SUPPRIMÉ ou renommé est bloqué en CI.
# ---------------------------------------------------------------------------

targets:
  $default:
    builders:
      json_serializable:
        options:
          any_map: false
          # `checked: true` conserve des messages d'erreur exploitables
          # (nom du champ fautif) au lieu d'un cast raté opaque.
          checked: true
          create_factory: true
          create_to_json: true
          disallow_unrecognized_keys: false
          # Indispensable : sans lui, les modèles imbriqués sont sérialisés
          # via toJson() implicite et l'outbox stocke des objets Dart au lieu
          # de JSON.
          explicit_to_json: true
          field_rename: none
          ignore_unannotated: false
          include_if_null: false
