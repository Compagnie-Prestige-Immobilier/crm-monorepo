# Lints assouplis : TOUT le code de ce paquet est généré.
#
# apps/mobile garde `package:flutter_lints` en entier. Si les règles strictes
# s'appliquaient ici, chaque régénération produirait des centaines
# d'avertissements qu'aucun développeur ne peut corriger (le fichier serait
# réécrit au prochain `generate`), et `flutter analyze` deviendrait un bruit
# qu'on apprend à ignorer : ce qui masque les vrais problèmes dans apps/mobile.
#
# On ne désactive pas l'analyse : les erreurs de type restent des erreurs. On
# ne désactive que les règles de style et les avertissements que le générateur
# produit structurellement.

include: package:lints/core.yaml

analyzer:
  errors:
    # Le générateur importe parfois des modèles inutilisés dans api.dart.
    unused_import: ignore
    unused_element: ignore
    unused_field: ignore
    # `deprecated_member_use` remonte dès que dio déprécie un paramètre : ce
    # n'est corrigeable qu'en régénérant avec une version plus récente.
    deprecated_member_use: ignore
  exclude:
    - '**/*.g.dart'

linter:
  rules:
    constant_identifier_names: false
    library_private_types_in_public_api: false
    prefer_final_locals: false
    avoid_renaming_method_parameters: false
    non_constant_identifier_names: false
    unnecessary_brace_in_string_interps: false
    depend_on_referenced_packages: false
