# Configuration openapi-generator 7.24.0 (version épinglée dans /openapitools.json).
#
# Lancer via `pnpm --filter @crm/api-client-dart generate`, jamais à la main :
# le script racine épingle JAVA_HOME et enchaîne build_runner + dart format.
#
# ---------------------------------------------------------------------------
# ATTENTION : les chemins ci-dessous sont relatifs à LA RACINE DU DÉPÔT, pas à
# ce fichier. Ce n'est pas une inattention.
#
# @openapitools/openapi-generator-cli 2.24.0 résout `generator-cli.storageDir`
# (défini dans /openapitools.json) avec `path.resolve(cwd, storageDir)` où
# `cwd = process.env.PWD || process.env.INIT_CWD || process.cwd()`. Autrement
# dit le cache du jar suit le répertoire courant : lancé depuis ce paquet, le
# jar de 30 Mo atterrit dans packages/api-client-dart/node_modules/.cache/ et
# non dans le node_modules/.cache/openapi-generator que la CI met en cache :
# on retéléchargerait le générateur à chaque exécution, et deux copies
# traîneraient dans l'arbre. `PWD` ne peut pas être forcé de l'extérieur : le
# shim shell de pnpm le réécrit au démarrage.
#
# Un seul cwd possible pour tout le monde, donc : la racine du dépôt.
# tools/dev/generate-dart-client.mjs s'y place. À la main, depuis la racine :
#
#   pnpm exec openapi-generator-cli generate -c packages/api-client-dart/openapi-config.yaml
# ---------------------------------------------------------------------------

generatorName: dart-dio
inputSpec: apps/api/openapi.json
outputDir: packages/api-client-dart

additionalProperties:
  pubName: crm_api_client
  pubLibrary: crm_api_client

  # BETA en 7.24.0 : le défaut reste built_value. Choix délibéré, voir
  # docs/adr/0002. built_value impose BuiltList/BuiltMap et un registre
  # Serializers global qui traverse toute l'application : chaque état Riverpod,
  # chaque conversion Drift, chaque payload d'outbox (`outbox.payload` est
  # littéralement la sortie de `model.toJson()`) passerait cette frontière.
  #
  # REPLI si cette voie beta produit du code cassé : remettre
  # `serializationLibrary: built_value` ici, et confiner le résultat derrière
  # des mappers dans ce paquet pour qu'aucun BuiltList n'atteigne apps/mobile.
  # C'est un changement d'une ligne : l'inverse (désimbriquer built_value d'une
  # application entière) ne l'est pas.
  serializationLibrary: json_serializable

  # Une valeur d'énumération inconnue devient le cas `unknownDefaultOpenApi`
  # au lieu de lever une exception. Les téléphones du terrain ne peuvent pas
  # être mis à jour de force : ajouter un statut côté serveur ne doit pas faire
  # planter une version installée il y a six mois.
  enumUnknownDefaultCase: true

  # Égalité par valeur, indispensable au diffing de Riverpod / Flutter.
  equalityCheckMethod: equatable

  # Modèles immuables : un champ `final` ne peut pas être muté après lecture
  # depuis le cache local.
  finalProperties: true
  skipCopyWith: false

  # `core` = DateTime de dart:core. Évite d'imposer time_machine à l'app.
  dateLibrary: core

  # `src`, PAS `lib/src` : le générateur préfixe déjà `lib/`. Avec `lib/src` la
  # sortie atterrit dans lib/lib/src/, que `dart analyze` accepte sans broncher
  # et que `package:crm_api_client/src/...` ne peut pas importer.
  # (`config-help -g dart-dio` : « source folder for generated code (Default: src) ».)
  sourceFolder: src

globalProperties:
  # Aucune documentation ni test générés : ce sont des centaines de fichiers
  # qui n'apportent rien, alourdissent chaque revue et bruitent le portillon
  # anti-dérive.
  apiDocs: false
  modelDocs: false
  apiTests: false
  modelTests: false
