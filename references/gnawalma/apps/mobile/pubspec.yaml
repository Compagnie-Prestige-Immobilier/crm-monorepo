name: gnawalma
description: Marketplace d'ateliers de couture et gestion d'atelier.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.10.0
  flutter_riverpod: ^3.1.0
  go_router: ^17.0.1
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  image_picker: ^1.2.0
  flutter_contacts: ^2.1.0
  geolocator: ^14.0.2
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  forui: ^0.21.3
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  fresh_dio: ^0.6.0
  talker_flutter: ^5.1.16
  talker_dio_logger: ^5.1.20
  connectivity_plus: ^7.3.1
  shared_preferences: ^2.5.5
  cached_query_flutter: ^3.4.0
  cached_storage: ^3.3.0
  infinite_scroll_pagination: ^5.1.1
  flutter_local_notifications: ^22.3.0
  timezone: ^0.11.1
  app_links: ^7.0.0
  json_annotation: ^4.12.0
  package_info_plus: ^9.0.1
  record: ^6.0.0
  just_audio: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  json_serializable: ^6.14.1
  swagger_parser: ^1.44.1
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#0B0B0C"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
