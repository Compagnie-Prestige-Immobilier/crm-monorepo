<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gnawalma - App Download</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@200;900&family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="noise-overlay"></div>
    <div class="grid-background"></div>
    
    <!-- Massive Typographic Background -->
    <div class="typo-bg">GNAWALMA</div>

    <main class="viewport">
        <header class="top-bar">
            <img src="logo.png" alt="Gnawalma Logo" class="brand-logo">
            <div class="status-indicator">
                <span class="status-dot"></span>
                <span class="status-text">SYSTEM OPERATIONAL</span>
            </div>
        </header>

        <div class="content-grid">
            <div class="info-block">
                <h1 class="headline">
                    ATELIER <br>
                    <span class="text-gradient">DIGITAL</span>
                </h1>
                <p class="tagline">
                    L'outil de précision pour les tailleurs exigeants.
                    <br>Gestion de stock. Suivi commande. Facturation.
                </p>
                
                <div class="meta-data">
                    <div class="meta-item">
                        <span class="label">VERSION</span>
                        <span class="value">v1.0.0 Alpha</span>
                    </div>
                    <div class="meta-item">
                        <span class="label">PLATFORM</span>
                        <span class="value">Android</span>
                    </div>
                    <div class="meta-item">
                        <span class="label">BUILD</span>
                        <span class="value">#2026.02.15 22:46</span>
                    </div>
                </div>
            </div>

            <div class="action-block">
                <a href="./app-release.apk" class="download-trigger" download>
                    <div class="trigger-content">
                        <span class="trigger-label">INITIALIZE DOWNLOAD</span>
                        <span class="trigger-sub">APK FILE • 47M</span>
                    </div>
                    <div class="trigger-icon">
                        <svg viewBox="0 0 24 24" fill="none" class="arrow-icon">
                            <path d="M12 3V17M12 17L7 12M12 17L17 12" stroke="currentColor" stroke-width="2"/>
                            <path d="M21 21H3" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </div>
                </a>
            </div>
        </div>
    </main>
</body>
</html>
