name: gnawalma
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.11.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Database

  isar_plus: ^1.2.0
  isar_plus_flutter_libs: ^1.2.0
  path_provider: ^2.1.5
  path: ^1.9.0

  # Image handling
  image_picker: ^1.0.4
  file_picker: ^8.1.4
  flutter_image_compress: ^2.1.0

  # Date & Time
  intl: ^0.18.1

  # UI utilities
  fl_chart: ^0.69.0
  package_info_plus: ^8.0.0

  # Utils
  uuid: ^4.2.1
  crypto: ^3.0.3

  # Security & Notifications
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4

  # Cache & Storage
  url_launcher: ^6.3.2
  pdf: ^3.11.3
  printing: ^5.14.2
  share_plus: ^12.0.1
  hive_ce: ^2.19.1
  hive_ce_flutter: ^2.3.4
  logger: ^2.6.2
  palette_generator: ^0.3.3+7
  flutter_animate: ^4.5.2
  record: ^6.1.2
  audioplayers: ^6.5.1
  permission_handler: ^12.0.1
  go_router: ^17.0.1
  get_it: ^9.2.0
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.1.0
  collection: ^1.19.1
  dio: ^5.10.0
  connectivity_plus: ^7.3.0
  skeletonizer: ^2.1.2
  flutter_svg: ^2.3.0
  simple_icons: ^16.23.0
  flutter_map: ^8.3.1
  latlong2: ^0.10.1
  geolocator: ^14.0.2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  flutter_contacts: ^2.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: any
  flutter_launcher_icons: ^0.14.4
  riverpod_generator: ^4.0.0+1
  freezed: ^3.2.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/
    - assets/illustrations/
    - assets/anim/
    - assets/icons/
    - assets/icons/navigations/
    - assets/icons/actions/
    - assets/icons/sewing/
    - assets/icons/garments/
    - assets/icons/ui/
    - assets/icons/illustrations/
    - assets/icons/illustrations/empty_states/
    - assets/icons/illustrations/states/
