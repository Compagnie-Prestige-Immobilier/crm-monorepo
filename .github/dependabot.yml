version: 2

# `cooldown` est l'équivalent Dependabot de `minimumReleaseAge` de
# pnpm-workspace.yaml : sept jours avant qu'une version fraîchement publiée
# puisse être proposée.
#
# Sans lui, les deux réglages se contredisent — pnpm refuse d'installer une
# version de moins de sept jours, et Dependabot ouvre quand même une PR pour
# elle. Résultat : une PR rouge à l'installation que personne ne comprend, et
# l'habitude prise de la fusionner de force. La protection ne tient que si les
# deux bouts de la chaîne portent le même seuil.
#
# `semver-major` reste à sept jours lui aussi : un majeur malveillant n'est pas
# moins dangereux qu'un correctif malveillant, il est seulement plus visible.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # UNE seule pull request pour tout le lot, et non cinq.
    #
    # Chaque PR declenche la suite complete : ~25 minutes facturees. A cinq
    # actions plus cinq paquets npm par semaine, Dependabot depensait a lui seul
    # la moitie des 2 000 minutes mensuelles incluses, pour des montees de
    # version qui se relisent tres bien ensemble.
    #
    # Le groupe ne masque rien : le corps de la PR liste chaque dependance et sa
    # version. Ce qu'on perd, c'est de pouvoir fusionner l'une sans les autres ;
    # c'est le prix, et il est faible sur des montees hebdomadaires.
    groups:
      actions:
        patterns: ['*']
    # UNE pull request ouverte a la fois, par ecosysteme. Avec npm, cela plafonne
    # a deux le nombre de series de verification declenchees par semaine.
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    # Deux groupes et non un seul : un majeur se relit, se teste et se fusionne
    # autrement qu'un correctif, et les melanger obligerait a tout retenir pour
    # une seule montee qui coince.
    groups:
      npm-mineur-et-correctif:
        patterns: ['*']
        update-types: [minor, patch]
      npm-majeur:
        patterns: ['*']
        update-types: [major]
    # Le plafond porte sur les pull requests OUVERTES, pas sur les groupes : les
    # deux groupes existent toujours, mais le second attend que le premier soit
    # fusionne. Les correctifs passent donc en premier, et un majeur qui coince
    # ne les retient plus.
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /infra/docker
    schedule:
      interval: monthly
    groups:
      docker:
        patterns: ['*']
    open-pull-requests-limit: 1
    cooldown:
      default-days: 7
      semver-major-days: 7
      semver-minor-days: 7
      semver-patch-days: 7
