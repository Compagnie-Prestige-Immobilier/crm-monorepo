name: Setup Node + pnpm
description: >-
  Installe Node 24.18.0, pnpm 11.15.1, restaure le cache turbo et installe les
  dépendances du workspace. Factorisé parce que trois jobs en ont besoin et
  qu'une divergence de version entre eux produit des échecs qu'on met une
  demi-journée à comprendre.

inputs:
  install:
    description: Lancer `pnpm install --frozen-lockfile`
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      with:
        version: 11.15.1

    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: 24.18.0
        cache: pnpm

    # Cache turbo local : les paquets inchangés ne sont pas reconstruits d'une
    # PR à l'autre. La clé inclut le SHA pour écrire une nouvelle entrée à
    # chaque commit, les restore-keys rattrapent la plus récente.
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-${{ github.job }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-${{ github.job }}-
          turbo-${{ runner.os }}-

    - if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
