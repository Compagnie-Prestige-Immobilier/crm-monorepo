name: ci

# `dev` seulement. `prod` n'a aucune CI : Dokploy la tire en git et construit le
# Dockerfile lui-même. Ce qui arrive sur `prod` doit avoir été vert sur `dev`.
on:
  pull_request:
    branches: [dev]
    paths-ignore: ['docs/**', '**.md']
  push:
    branches: [dev]
    paths-ignore: ['docs/**', '**.md']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DO_NOT_TRACK: '1'

jobs:
  statique:
    name: statique, plafonds, lint, types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # Tout `*_test.go` sans le tag `integration` est un test unitaire, interdit ici.
      - name: Aucun test unitaire
        run: |
          for f in $(git ls-files '*_test.go'); do
            head -1 "$f" | grep -q '^//go:build integration$' || { echo "::error::$f sans tag integration"; exit 1; }
          done
      - name: Plafonds et artefacts générés
        run: tools/dev/plafonds.sh
      - id: outils
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: outils-${{ runner.os }}-sqlc-1.31.1-goose-3.28.0
      - if: steps.outils.outputs.cache-hit != 'true'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - run: sqlc generate
      # `web/embed.go` embarque `web/dist`, construit plus bas : sans dossier, le lint refuse de typer.
      - run: mkdir -p web/dist && touch web/dist/.keep
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
      - run: go vet -tags integration ./...

      # Le panneau se type depuis le document OpenAPI du binaire, produit ici et jamais commité.
      - run: pnpm install --frozen-lockfile
      - run: go run ./cmd/server -openapi > openapi.json
      - run: pnpm format:check && pnpm dead-code
      - run: pnpm --filter @crm/panel gen
      # `vite build` engendre `routeTree.gen.ts`, non commité : le typecheck vient après.
      - run: pnpm --filter @crm/panel build
      - run: pnpm lint && pnpm typecheck

  # Un seul binaire, produit une fois : les quatre parts de parcours le réutilisent.
  binaire:
    name: binaire, panneau embarqué
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      # Aucun changement du serveur, du SQL ni du panneau : le binaire précédent est repris tel quel.
      - id: deja
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: cpi-go
          key: binaire-${{ hashFiles('go.mod', 'go.sum', 'sqlc.yaml', 'cmd/**', 'internal/**', 'sql/**', 'web/**', 'pnpm-lock.yaml') }}
      - if: steps.deja.outputs.cache-hit != 'true'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - if: steps.deja.outputs.cache-hit != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - if: steps.deja.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: steps.deja.outputs.cache-hit != 'true'
        id: outils
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: outils-${{ runner.os }}-sqlc-1.31.1-goose-3.28.0
      - if: steps.deja.outputs.cache-hit != 'true' && steps.outils.outputs.cache-hit != 'true'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 github.com/pressly/goose/v3/cmd/goose@v3.28.0
      - if: steps.deja.outputs.cache-hit != 'true'
        run: |
          sqlc generate
          mkdir -p web/dist && touch web/dist/.keep
          pnpm install --frozen-lockfile --filter @crm/panel
          go run ./cmd/server -openapi > openapi.json
          pnpm --filter @crm/panel gen && pnpm --filter @crm/panel build
          CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o cpi-go ./cmd/server
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: cpi-go
          path: cpi-go
          retention-days: 3

  integration:
    name: intégration, sqlc vet et tests Go
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?sslmode=disable
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?sslmode=disable
      DATABASE_URL_DEMO: postgresql://crm:crm@localhost:5432/crm_demo?sslmode=disable
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - id: outils
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/go/bin
          key: outils-${{ runner.os }}-sqlc-1.31.1-goose-3.28.0
      - if: steps.outils.outputs.cache-hit != 'true'
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 github.com/pressly/goose/v3/cmd/goose@v3.28.0
      # Le binaire applique goose au démarrage : une base qui n'a que
      # `schema.sql` n'est PAS celle de production. Sans les migrations ici,
      # `sqlc vet` échouait sur chaque colonne ajoutée depuis le dernier gel du schéma.
      - name: Schéma et migrations sur la base de test et sur la seconde base
        run: |
          PGPASSWORD=crm psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -q -f sql/schema.sql
          PGPASSWORD=crm psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE crm_demo'
          PGPASSWORD=crm psql -h localhost -U crm -d crm_demo -v ON_ERROR_STOP=1 -q -f sql/schema.sql
          goose -dir sql/migrations postgres "$DATABASE_URL" up
          goose -dir sql/migrations postgres "$DATABASE_URL_DEMO" up
      # `vet` prépare chaque requête sur la base réelle : une colonne absente rougit ici, pas en production.
      - run: sqlc generate && sqlc vet
      - run: mkdir -p web/dist && touch web/dist/.keep
      # L'export de la base appelle `pg_dump`, qui refuse un serveur plus récent que lui.
      - name: pg_dump 18
        run: |
          sudo apt-get install -y -q postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y -q postgresql-client-18
      - run: go test -tags integration -count=1 ./...

  # Quatre runners, un quart des fichiers chacun ; chaque part a sa base et son
  # binaire, qui applique lui-même les migrations au démarrage et au semis.
  parcours:
    name: parcours Playwright ${{ matrix.part }}/4
    needs: binaire
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?sslmode=disable
      DATABASE_URL_DEMO: postgresql://crm:crm@localhost:5432/crm_demo?sslmode=disable
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: cpi-go
      - run: chmod +x cpi-go
      - run: |
          PGPASSWORD=crm psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -q -f sql/schema.sql
          PGPASSWORD=crm psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -q -c 'CREATE DATABASE crm_demo'
          PGPASSWORD=crm psql -h localhost -U crm -d crm_demo -v ON_ERROR_STOP=1 -q -f sql/schema.sql
      - run: pnpm install --frozen-lockfile --filter @crm/panel-e2e
      - id: navigateur
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.navigateur.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      # Le parcours « seconde base » se connecte à un profil démo : sans semis, la base démo le refuse.
      - run: DATABASE_URL="$DATABASE_URL_DEMO" ./cpi-go -seed
      - run: pnpm test --shard=${{ matrix.part }}/4
        working-directory: e2e

  securite:
    name: sécurité, secrets, SAST, dépendances
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  sonar:
    name: SonarQube Cloud, quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: statique
    if: ${{ vars.SONAR_ENABLED == 'true' && github.event_name != 'push' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: SonarQube Cloud scan and gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
