name: ci

on:
  pull_request:
    branches: [dev, prod]
  push:
    branches: [dev, prod]

permissions:
  contents: read

# Une PR poussée trois fois n'occupe pas trois fois les runners. Pas sur `prod` :
# une annulation y tomberait pendant la mise en ligne que `deploy` porte.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

env:
  DO_NOT_TRACK: '1'

jobs:
  go:
    name: go — plafonds, sqlc, lint, panneau, intégration, Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?sslmode=disable
      TEST_DATABASE_URL: postgresql://crm:crm@localhost:5432/crm?sslmode=disable
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_DB: crm
          POSTGRES_USER: crm
          POSTGRES_PASSWORD: crm
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U crm -d crm"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      # Tout `*_test.go` sans le tag `integration` est un test unitaire, interdit ici.
      - name: Aucun test unitaire
        run: |
          for f in $(git ls-files '*_test.go'); do
            head -1 "$f" | grep -q '^//go:build integration$' || { echo "::error::$f sans tag integration"; exit 1; }
          done
      - name: Plafonds et artefacts générés
        run: tools/dev/plafonds.sh

      - name: Schéma sur la base de test
        run: PGPASSWORD=crm psql -h localhost -U crm -d crm -v ON_ERROR_STOP=1 -q -f sql/schema.sql
      # `vet` prépare chaque requête sur la base réelle : une colonne absente
      # rougit ici, pas en production.
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate && go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 vet
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - run: go vet -tags integration ./...

      # Le panneau se type depuis le document OpenAPI du binaire, produit ici
      # et jamais commité ; `dist/` est ensuite embarqué par `go build`.
      - run: pnpm install --frozen-lockfile
      - run: go run ./cmd/server -openapi > openapi.json
      - run: pnpm format:check && pnpm dead-code
      - run: pnpm --filter @crm/panel gen
      - run: pnpm lint && pnpm typecheck
      - run: pnpm --filter @crm/panel build
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o cpi-go ./cmd/server
      - run: go test -tags integration -count=1 ./...

      - run: pnpm exec playwright install --with-deps chromium
        working-directory: e2e
      - run: pnpm test
        working-directory: e2e
      # L'image que Dokploy construira : un COPY oublié se voit ici, pas le jour J.
      - run: docker build -t cpi-go:ci .

  # Appelés ici et non déclenchés à côté : `needs` ne franchit pas la frontière
  # d'un workflow, et `deploy` doit pouvoir les attendre.
  securite:
    name: sécurité — secrets, SAST, dépendances, image
    if: github.event_name != 'push' || github.ref == 'refs/heads/prod'
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read

  sonar:
    name: SonarQube Cloud — quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: go
    # Pas sur `prod` : SonarCloud la classe en branche courte et refuse de
    # rendre le verdict ; le commit a déjà été analysé sur `dev`.
    if: >-
      ${{ vars.SONAR_ENABLED == 'true'
      && github.ref != 'refs/heads/prod'
      && github.event_name != 'push' }}
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
      SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: SonarQube Cloud scan and gate
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2 # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.qualitygate.wait=true
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}

  # Dokploy est branché en « custom git » et ne reçoit aucun crochet GitHub :
  # sans ce job, fusionner vers `prod` ne déploie rien. `sonar` a droit à
  # `skipped` parce qu'il porte `if: vars.SONAR_ENABLED`.
  deploy:
    name: déploiement Dokploy (prod)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [go, sonar, securite]
    if: >-
      !cancelled()
      && github.event_name == 'push'
      && github.ref == 'refs/heads/prod'
      && needs.go.result == 'success'
      && needs.securite.result == 'success'
      && (needs.sonar.result == 'success' || needs.sonar.result == 'skipped')
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Vérifier le secret
        env:
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
        run: |
          if [ -z "${DOKPLOY_KEY}" ]; then
            echo "::error::Le secret DOKPLOY_KEY n'est pas défini sur ce dépôt."
            echo "::error::Le poser avec : gh secret set DOKPLOY_KEY"
            exit 1
          fi
      # `redeploy` et non `deploy` : `deploy` engendrerait des secrets dans le
      # journal et redémarrerait Postgres à chaque fusion.
      - name: Redéployer le binaire
        env:
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_KEY }}
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
        run: python3 infra/dokploy/deploy.py redeploy cpi-go
