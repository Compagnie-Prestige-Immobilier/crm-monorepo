name: deploy

# Le déploiement ne se déclenche QUE sur `prod`.
#
# `prod` n'accepte aucun push direct — la règle de dépôt l'interdit, force push
# compris — donc le seul chemin qui arrive ici est la fusion d'une pull request
# dont la CI est passée. Le déclencheur et la protection de branche sont deux
# moitiés de la même garantie : sans la protection, ce workflow déploierait
# n'importe quel `git push --force` ; sans le déclencheur, la protection ne
# servirait qu'à ralentir les fusions.
on:
  push:
    branches: [prod]
  # Rejouer un déploiement sans refaire une PR — après une panne d'un service
  # externe, par exemple, où le commit est bon et c'est l'exécution qui a
  # échoué.
  workflow_dispatch:

permissions:
  contents: read

# Deux déploiements simultanés sur le même environnement se marchent dessus et
# le gagnant est celui qui finit en dernier, pas celui qui porte le code le plus
# récent. `cancel-in-progress: false` : on laisse le déploiement en cours finir
# proprement plutôt que de l'interrompre à mi-parcours.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Vérifier la configuration VPS
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          missing=()
          for name in PRODUCTION_HOST PRODUCTION_USER PRODUCTION_PATH PRODUCTION_SSH_KEY PRODUCTION_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if ((${#missing[@]})); then
            echo "::error::Secrets production manquants : ${missing[*]}"
            echo "Créer ces secrets dans Settings > Environments > production."
            exit 1
          fi
          if [[ ! "$PRODUCTION_PATH" =~ ^/[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::PRODUCTION_PATH doit être un chemin absolu sans espace ni caractère shell."
            exit 1
          fi

      - name: Préparer SSH
        env:
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_KNOWN_HOSTS: ${{ secrets.PRODUCTION_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PRODUCTION_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PRODUCTION_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Déployer la stack Docker sur le VPS
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o IdentitiesOnly=yes "$PRODUCTION_USER@$PRODUCTION_HOST" \
            "cd '$PRODUCTION_PATH' && \
             git fetch --prune origin prod && \
             git checkout --force prod && \
             git reset --hard origin/prod && \
             docker compose -f infra/docker/docker-compose.prod.yml up -d --build && \
             docker compose -f infra/docker/docker-compose.prod.yml ps"

      - name: Vérifier la santé HTTP production
        env:
          PRODUCTION_HEALTHCHECK_URL: ${{ secrets.PRODUCTION_HEALTHCHECK_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$PRODUCTION_HEALTHCHECK_URL" ]]; then
            echo "PRODUCTION_HEALTHCHECK_URL absent : vérification HTTP ignorée."
            exit 0
          fi
          curl --fail --silent --show-error --retry 10 --retry-delay 5 \
            --retry-all-errors --output /dev/null "$PRODUCTION_HEALTHCHECK_URL"
