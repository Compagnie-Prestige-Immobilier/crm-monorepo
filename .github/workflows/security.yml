name: security

# Trois scanners, trois questions différentes — et c'est pour cela qu'ils sont
# tous les trois là plutôt qu'un seul :
#
#   gitleaks    « un secret a-t-il été commis ? »        → historique git
#   semgrep     « le code contient-il un motif dangereux ? » → source
#   osv-scanner « une dépendance est-elle vulnérable ? »  → fichiers de verrou
#
# Aucun ne couvre le domaine d'un autre. Un dépôt qui n'exécute que `pnpm audit`
# ne verra jamais une clé AWS commise, et un dépôt qui n'exécute que gitleaks ne
# verra jamais une injection SQL.
on:
  # `ci.yml` porte `pull_request` et `push` et appelle ce fichier : les redéclarer
  # ici ferait tourner les scanners deux fois par PR.
  workflow_call:
  # Une dépendance saine aujourd'hui est vulnérable demain sans qu'une seule
  # ligne du dépôt n'ait bougé. Sans exécution planifiée, on ne l'apprend qu'au
  # prochain commit — c'est-à-dire peut-être jamais sur une branche stable.
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# Même exception que dans `ci.yml`, et pour la même raison : appelés depuis
# `ci.yml`, ces jobs précèdent une mise en ligne. Les annuler sur `prod`
# annulerait l'exécution qui porte le déploiement.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/prod' }}

jobs:
  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # L'historique COMPLET. Avec le clone superficiel par défaut, gitleaks
          # ne voit que le dernier commit — or un secret retiré au commit
          # suivant est toujours un secret publié, et c'est exactement celui
          # qu'on cherche.
          fetch-depth: 0

      - name: gitleaks
        run: |
          VERSION=8.30.1
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-banner --redact --exit-code 1

  sast:
    name: semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep:1.145.0@sha256:b68f9b68483955b85042dac7b4533757779625a02dcf91e470da4c2df1b430be
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      # `--error` fait échouer le job sur toute règle déclenchée. Un scanner qui
      # rapporte sans bloquer produit un tableau de bord que personne ne lit.
      #
      # Pas de `p/dart` : ce paquet de règles n'existe pas sur le registre
      # Semgrep (404) et sa présence faisait ABANDONNER le scan entier en
      # rendant « 0 finding » — un vert qui ne voulait rien dire.
      #
      # `detect-non-literal-regexp` bloquait sur 28 emplacements, tous des
      # tests qui construisent un matcher de nom accessible depuis leur propre
      # paramètre. Aucun `new RegExp(` hors des tests dans le dépôt : la règle
      # ne protégeait rien et refusait tout. Si du code produit relit une
      # expression depuis une entrée, c'est cette exclusion qu'il faut retirer.
      # `rep-script.tsx:680` est un libellé React, pas un appel à util.format ni du logging.
      - name: semgrep
        run: |
          semgrep scan \
            --config=p/default \
            --config=p/secrets \
            --config=p/typescript \
            --config=p/nodejs \
            --config=p/react \
            --config=p/sql-injection \
            --config=p/jwt \
            --config=p/owasp-top-ten \
            --exclude-rule=package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age \
            --exclude-rule=package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age \
            --exclude-rule=javascript.lang.security.audit.detect-non-literal-regexp.detect-non-literal-regexp \
            --exclude-rule=javascript.lang.security.audit.unsafe-formatstring.unsafe-formatstring \
            --exclude=node_modules --exclude=build \
            --metrics=off --error

  dependencies:
    name: osv-scanner
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # L'analyse d'appels Go compile le module : sans `db/`, jamais commité, elle échoue.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - run: go run github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1 generate

      - name: osv-scanner
        run: |
          VERSION=2.5.0
          curl -sSfL -o /tmp/osv-scanner \
            "https://github.com/google/osv-scanner/releases/download/v${VERSION}/osv-scanner_linux_amd64"
          echo "edcfc41d257db36148f065055655fe3fcfc434b0b423ea67468a84c207524e0c  /tmp/osv-scanner" | sha256sum -c -
          chmod +x /tmp/osv-scanner
          # `go.sum` n'a pas d'extracteur : le scan rendait zéro paquet Go et
          # sortait 0, donc aucune vulnérabilité Go n'a jamais été signalée.
          /tmp/osv-scanner scan source --config=osv-scanner.toml --lockfile=pnpm-lock.yaml --lockfile=go.mod
      - name: pnpm audit
        run: pnpm audit --audit-level=high --prod

  containers:
    name: trivy — filesystem and configuration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
